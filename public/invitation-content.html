<!-- Fixed background -->
<div class="pager-bg-container" id="bgContainer">
  <div class="pager-bg-slide" style="background-image: url('hug.jpg'); opacity: 1;"></div>
</div>
<div class="pager-overlay"></div>

<!-- Intro screen (separate from pager) -->
<div class="intro-screen" id="introScreen">
  <p class="beloved-name" id="belovedName"></p>
  <p class="intro-invite-text">You are invited to join us celebrate our wedding</p>
  <button class="outline-btn" id="startButton">TAP TO START</button>
</div>

<!-- Pager (hidden until started) -->
<div class="pager" id="pager">

  <!-- Slide 1: Quote -->
  <div class="slide">
    <div class="slide-content">
      <blockquote id="quote"> <span id="quoteAuthor"></span></blockquote>
    </div>
  </div>

  <!-- Slide 2: Hosts & Invitation -->
  <div class="slide">
    <div class="slide-content">
      <p class="hosts-label" id="hosts"></p>
      <p class="body-text" id="invitationText"></p>
    </div>
  </div>

  <!-- Slide 3: Names, Date & Countdown -->
  <div class="slide">
    <div class="slide-content">
      <h1 class="couple-names">
        <span class="name" id="groom"></span>
        <span class="amp" id="and"></span>
        <span class="name" id="bride"></span>
      </h1>
      <h3 class="wedding-date" id="date"></h3>
      <div class="countdown" id="countdown">
        <div class="box"><span class="num" id="days"></span><span class="lbl" id="daysLabel"></span></div>
        <div class="box"><span class="num" id="hours"></span><span class="lbl" id="hoursLabel"></span></div>
        <div class="box"><span class="num" id="minutes"></span><span class="lbl" id="minutesLabel"></span></div>
        <div class="box"><span class="num" id="seconds"></span><span class="lbl" id="secondsLabel"></span></div>
      </div>
    </div>
  </div>

  <!-- Slide 4: Church location (Index 3) -->
  <div class="slide">
    <div class="slide-content">
      <h2 id="locationTitle"></h2>
      <p class="body-text" id="time"></p>
      <a href="https://www.google.com/maps/dir/?api=1&destination_place_id=ChIJr33WMqA5HxUR6q79hqMiWiE%20VMMX+XVX&destination=Mar%20Abda%20Church%20qannabe,%20VMMX+XVX,%20Bsefrine,%20Lebanon" target="_blank" id="locationMap" class="outline-btn"></a>
    </div>
  </div>

  <!-- Slide 5: Reception location (Index 4) -->
  <div class="slide">
    <div class="slide-content">
      <p class="section-label" id="reception"></p>
      <h2 id="locationTitle2"></h2>
      <p class="body-text" id="time2"></p>
      <a href="https://www.google.com/maps/dir/?api=1&destination_place_id=ChIJz5CPuJg5HxURSi3Rf8Rh2hw&destination=VPJ3+PF6%20Level%20River%D8%8C%20%D8%B5%D8%A7%D9%84%D9%8A%D9%85%D8%A7%D8%8C%20%D8%B7%D8%B1%D9%8A%D9%82,%20Salima,%20Lebanon" target="_blank" id="locationMap2" class="outline-btn"></a>
    </div>
  </div>

  <!-- Slide 6: Gift Registry -->
  <div class="slide">
    <div class="slide-content">
      <h3 id="giftRegistryTitle"></h3>
      <p class="body-text" id="giftRegistryDesc"></p>
      <p class="account-num" id="accountNumber"></p>
      <img src="whish.jpg" alt="Whish" class="whish-img" />
    </div>
  </div>

  <!-- Slide 7: RSVP -->
  <div class="slide">
    <div class="slide-content">
      <h3 id="rsvpTitle"></h3>
      <div class="rsvp-form-card">
        <label for="attendance" id="attendanceLabel"></label>
        <select id="attendance" required>
          <option value="" disabled selected></option>
          <option value="yes"></option>
          <option value="no"></option>
        </select>
        <label for="number" id="numberLabel"></label>
        <select id="number" required>
          <option value="" disabled selected></option>
        </select>
        <button type="button" id="submitBtn" disabled class="outline-btn submit-btn"></button>
      </div>
    </div>
  </div>

</div>

<!-- Dot indicators -->
<div class="pager-dots" id="pagerDots"></div>

<audio id="weddingAudio" loop preload="auto"></audio>
