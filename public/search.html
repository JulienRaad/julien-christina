<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Table Finder</title>
  <!-- Open Graph -->
  <meta property="og:title" content="Table Finder" />
  <meta property="og:description" content="Thank you for being part of our big day! Search and find your table." />
  <meta property="og:url" content="https://www.jcraadwedding.com/search" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="JCRaadWedding" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <!-- Font Awesome for search icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="search.css" />
</head>

<body>
<div class="container">
  <div class="search-wrapper">
    <i class="fas fa-search search-icon"></i>
    <label for="guest-search"></label>
    <input id="guest-search" placeholder="Search by name or table" autocomplete="off" />
  </div>
  <ul id="suggestions" class="guest-list"></ul>
</div>
<script src="search.js"></script>
</body>

</html>
