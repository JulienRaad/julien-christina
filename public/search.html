<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guest Lookup</title>

  <!-- Roboto + Material Icons for a “Material-first” feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <link rel="stylesheet" href="search-styles.css" />
</head>
<body>
<header>
  <h1><span class="material-icons">search</span> Guest Finder</h1>
</header>

<main>
  <label for="guest-search" class="sr-only">Search for guest name</label>
  <input
          id="guest-search"
          type="search"
          placeholder="Start typing a name…"
          autocomplete="off"
  />

  <ul id="suggestions" class="card-list"></ul>
</main>

<script src="search-script.js"></script>
</body>
</html>
