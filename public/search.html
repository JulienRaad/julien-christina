<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Find Your Table</title>

  <link rel="stylesheet" href="search.css" />
</head>
<body>

<!-- Thank you message -->
<header class="thank-you">
  Thank You For Joining!
</header>

<!-- Card container for header + input -->
<section class="card header-card">
  <h1>Find your table</h1>

  <label for="guest-search" class="sr-only">Search for guest name</label>
  <input
          id="guest-search"
          type="text"
          placeholder="Type your name…"
          autocomplete="off"
          inputmode="search"
  />
</section>

<main>
  <ul id="suggestions" class="card-list"></ul>
</main>

<script src="search.js"></script>
</body>
</html>
